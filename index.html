<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TmC ARES | SARSILMAZ TAHTIM</title>
    <style>
        body { 
            background-color: #000; 
            color: #00ff41; 
            font-family: 'Courier New', monospace; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
            text-align: center;
        }

        /* 🔐 SAĞ ÜST ADMİN BUTONU */
        .admin-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            border: 1px solid #00ff41;
            color: #00ff41;
            background: transparent;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 2px;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 0.8em;
        }
        .admin-btn:hover {
            background: #00ff41;
            color: #000;
            box-shadow: 0 0 15px #00ff41;
        }

        .tmc-name {
            font-size: 2.5em;
            letter-spacing: 15px;
            color: #00ff41;
            margin-bottom: 10px;
            text-shadow: 0 0 15px #00ff41;
            font-weight: bold;
        }

        .throne-title {
            font-size: 1.2em;
            letter-spacing: 8px;
            color: #fff;
            margin-top: 30px;
            margin-bottom: 80px;
            text-shadow: 0 0 10px #fff;
        }

        .racon { 
            font-size: 4em; 
            font-weight: 900; 
            letter-spacing: 20px; 
            text-shadow: 0 0 30px #00ff41;
            text-transform: uppercase;
            border-top: 2px solid #00ff41;
            border-bottom: 2px solid #00ff41;
            padding: 20px 0;
            animation: heavy-glow 3s infinite alternate;
        }

        @keyframes heavy-glow {
            from { text-shadow: 0 0 10px #00ff41; transform: scale(1); }
            to { text-shadow: 0 0 50px #00ff41; transform: scale(1.02); }
        }

        /* 🔐 ADMİN PANELİ MODAL */
        #adminPanel { 
            display: none; 
            position: fixed; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            background: #000; 
            padding: 40px; 
            border: 2px solid #00ff41; 
            z-index: 9999; 
            box-shadow: 0 0 100px #000; 
        }
        input { background: #000; color: #00ff41; border: 1px solid #00ff41; padding: 12px; margin: 10px 0; width: 250px; text-align: center; font-family: 'Courier New', monospace; }
        button.login-btn { background: #00ff41; color: #000; border: none; padding: 12px 30px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <button class="admin-btn" onclick="toggleAdmin()">ADMIN GİRİŞİ</button>

    <div class="tmc-name">🔱 TmC ARES 🔱</div>
    <div class="throne-title">SARSILMAZ TAHTIM</div>
    
    <div class="racon">AZ LAF ÇOK İCRAAT</div>

    <div id="adminPanel">
        <h2 style="color: #00ff41; font-size: 1.2em; margin-bottom: 20px;">LORD KOMUTA MERKEZİ</h2>
        <input type="text" id="user" placeholder="Kullanıcı Adı">
        <input type="password" id="pass" placeholder="Yetki Mührü">
        <button class="login-btn" onclick="checkAdmin()">SİSTEME SIZ</button>
    </div>

    <script>
        // PANELİ AÇMA/KAPATMA
        function toggleAdmin() {
            var panel = document.getElementById('adminPanel');
            panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
        }

        // YETKİ KONTROLÜ VE YÖNLENDİRME
        function checkAdmin() {
            var u = document.getElementById('user').value;
            var p = document.getElementById('pass').value;
            
            // 🛡️ LORD'UN ÖZEL BİLGİLERİ
            if (u === "tmcares" && p === "ares1235") {
                alert("🔱 Otorite Onaylandı. Mahzen Kapıları Açılıyor...");
                // 🚀 GİZLİ ODAYA (admin.html) FİRLAT!
                window.location.href = "admin.html";
            } else {
                alert("❌ HATA: Yetkisiz Giriş Denemesi Kaydedildi!");
            }
        }

        // KLAVYEDEN 'A' TUŞU TETİĞİ
        document.addEventListener('keydown', function(e) {
            if (e.key === 'a' || e.key === 'A') { toggleAdmin(); }
        });
    </script>

</body>
</html>
